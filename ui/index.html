<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FieldNotes Mobile — App de Notas Sin Internet</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Bitter:wght@600;700&family=JetBrains+Mono:wght@400;500&family=Work+Sans:wght@400;500;600&display=swap"
    />
    <style>
      :root {
        color-scheme: light;
        --bg-studio: #efece6;
        --bezel-titanium: #1c1917;
        --screen-cream: #fffbeb;
        --card-paper: #ffffff;
        --ink-charcoal: #1c1917;
        --ink-stone: #57534e;
        --border-warm: #e7dec8;
        --leather-accent: #9a3412;
        --leather-hover: #7c2d12;
        --offline-amber: #d97706;
        --offline-bg: #fef3c7;
        --synced-pine: #15803d;
        --synced-bg: #dcfce7;
        --font-serif: "Bitter", Georgia, serif;
        --font-sans: "Work Sans", system-ui, sans-serif;
        --font-mono: "JetBrains Mono", ui-monospace, monospace;
      }

      *, *::before, *::after { box-sizing: border-box; }
      body {
        margin: 0;
        background: var(--bg-studio);
        color: var(--ink-charcoal);
        font-family: var(--font-sans);
        line-height: 1.5;
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
      }
      ::selection { background: var(--offline-bg); color: var(--leather-accent); }
      :focus-visible { outline: 2px solid var(--leather-accent); outline-offset: 2px; }
      button, input, textarea { font-family: inherit; }
      .fn-mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }

      .fn-topbar {
        max-width: 1100px;
        width: 100%;
        margin: 0 auto;
        padding: 16px 22px 8px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
      }
      .fn-topbar h1 {
        font-family: var(--font-serif);
        font-size: 20px;
        margin: 0;
        color: var(--ink-charcoal);
      }
      .fn-topbar-sub {
        font-size: 13px;
        color: var(--ink-stone);
      }
      .fn-btn-outline {
        border: 1px solid #d6cbb8;
        background: var(--card-paper);
        color: var(--ink-charcoal);
        border-radius: 8px;
        padding: 7px 14px;
        font-size: 13.5px;
        font-weight: 600;
        cursor: pointer;
      }
      .fn-btn-outline:hover { background: var(--screen-cream); }

      /* Centered Interactive Mobile Device */
      .fn-stage {
        flex: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 12px 16px 28px;
      }
      .fn-phone {
        width: 100%;
        max-width: 400px;
        height: min(720px, calc(100dvh - 108px));
        min-height: 540px;
        background: var(--bezel-titanium);
        border-radius: 38px;
        padding: 11px;
        box-shadow: 0 24px 48px -14px rgba(28, 25, 23, 0.34);
        display: flex;
        flex-direction: column;
      }
      .fn-screen {
        flex: 1;
        min-height: 0;
        background: var(--screen-cream);
        border-radius: 28px;
        overflow: hidden;
        display: flex;
        flex-direction: column;
      }

      .fn-phone-status {
        padding: 12px 18px 8px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-size: 12px;
        font-weight: 600;
      }
      .fn-conn-toggle {
        display: inline-flex;
        align-items: center;
        gap: 7px;
        border: 1px solid var(--border-warm);
        border-radius: 9999px;
        padding: 5px 12px;
        font-size: 12.5px;
        font-weight: 600;
        cursor: pointer;
      }
      .fn-conn-toggle[data-online="true"] {
        background: var(--synced-bg);
        border-color: #86efac;
        color: var(--synced-pine);
      }
      .fn-conn-toggle[data-online="false"] {
        background: var(--offline-bg);
        border-color: #fcd34d;
        color: #92400e;
      }

      .fn-phone-head {
        padding: 6px 18px 12px;
        border-bottom: 1px solid var(--border-warm);
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 8px;
      }
      .fn-phone-head h2 {
        font-family: var(--font-serif);
        font-size: 20px;
        margin: 0;
      }

      .fn-offline-banner {
        background: var(--offline-bg);
        color: #92400e;
        font-size: 12.5px;
        font-weight: 500;
        padding: 8px 16px;
        border-bottom: 1px solid #fde68a;
        display: none;
      }
      .fn-offline-banner[data-visible="true"] { display: block; }

      .fn-phone-body {
        flex: 1;
        min-height: 0;
        overflow-y: auto;
        padding: 14px 16px;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }

      .fn-note-card {
        background: var(--card-paper);
        border: 1px solid var(--border-warm);
        border-radius: 12px;
        padding: 13px 14px;
      }
      .fn-note-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 6px;
        margin-bottom: 4px;
      }
      .fn-note-title {
        font-family: var(--font-serif);
        font-size: 15px;
        font-weight: 700;
        margin: 0;
      }
      .fn-state-pill {
        font-size: 11px;
        font-weight: 600;
        padding: 2px 7px;
        border-radius: 6px;
        white-space: nowrap;
      }
      .fn-pill-sync { background: var(--synced-bg); color: var(--synced-pine); }
      .fn-pill-wait { background: var(--offline-bg); color: #92400e; }
      .fn-pill-conf { background: #fee2e2; color: #b91c1c; }

      .fn-note-body { font-size: 13px; color: var(--ink-stone); margin: 4px 0 8px; }
      .fn-note-actions { display: flex; flex-wrap: wrap; gap: 6px; }

      .fn-btn-primary {
        border: 1px solid var(--leather-accent);
        background: var(--leather-accent);
        color: #ffffff;
        border-radius: 9px;
        padding: 8px 13px;
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
      }
      .fn-btn-primary:hover { background: var(--leather-hover); }
      .fn-mini-btn {
        border: 1px solid var(--border-warm);
        background: var(--screen-cream);
        color: var(--ink-charcoal);
        border-radius: 7px;
        padding: 5px 9px;
        font-size: 12px;
        font-weight: 600;
        cursor: pointer;
      }

      .fn-sync-strip {
        padding: 10px 16px;
        border-top: 1px solid var(--border-warm);
        background: var(--card-paper);
        display: flex;
        gap: 8px;
      }

      /* Thumb-zone bottom navigation bar */
      .fn-tabbar {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        border-top: 1px solid var(--border-warm);
        background: var(--card-paper);
      }
      .fn-tab-btn {
        border: none;
        background: transparent;
        padding: 11px 6px;
        font-size: 12.5px;
        font-weight: 600;
        color: var(--ink-stone);
        cursor: pointer;
      }
      .fn-tab-btn[data-active="true"] {
        color: var(--leather-accent);
        background: var(--screen-cream);
      }

      .fn-input {
        width: 100%;
        border: 1px solid var(--border-warm);
        border-radius: 8px;
        padding: 9px 11px;
        font-size: 13.5px;
        background: var(--card-paper);
      }

      /* Layer 2 Architecture Drawer */
      .fn-backdrop {
        position: fixed;
        inset: 0;
        background: rgba(28, 25, 23, 0.38);
        z-index: 40;
        display: none;
        justify-content: flex-end;
      }
      .fn-backdrop[data-open="true"] { display: flex; }
      .fn-drawer {
        width: min(450px, 100vw);
        height: 100%;
        background: var(--card-paper);
        border-left: 1px solid var(--border-warm);
        display: flex;
        flex-direction: column;
      }
      .fn-drawer-head {
        padding: 16px 20px;
        border-bottom: 1px solid var(--border-warm);
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      .fn-drawer-body {
        flex: 1;
        overflow-y: auto;
        padding: 18px 20px;
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
    </style>
  </head>
  <body>
    <header class="fn-topbar">
      <div>
        <h1>FieldNotes Mobile</h1>
        <span class="fn-topbar-sub">Libreta de bolsillo que sigue funcionando sin señal ni Wi-Fi</span>
      </div>
      <button type="button" class="fn-btn-outline" id="fn-arch-btn">Arquitectura</button>
    </header>

    <main class="fn-stage">
      <div class="fn-phone" aria-label="Simulador de teléfono FieldNotes">
        <div class="fn-screen">
          <div class="fn-phone-status">
            <span class="fn-mono">09:42</span>
            <button type="button" class="fn-conn-toggle" id="fn-conn-btn" data-online="true">
              Con Wi-Fi · En línea
            </button>
          </div>

          <div class="fn-phone-head">
            <h2>Mis notas</h2>
            <button type="button" class="fn-btn-primary" id="fn-add-btn">+ Nota</button>
          </div>

          <div class="fn-offline-banner" id="fn-offline-banner">
            Sin señal: tus notas se guardan en el teléfono y esperan para enviarse.
          </div>

          <div class="fn-phone-body" id="fn-phone-body"></div>

          <div class="fn-sync-strip">
            <button type="button" class="fn-btn-primary" style="flex:1;" id="fn-sync-btn">Sincronizar ahora</button>
            <button type="button" class="fn-mini-btn" id="fn-sim-remote-btn">Simular choque</button>
          </div>

          <nav class="fn-tabbar" aria-label="Secciones móviles">
            <button type="button" class="fn-tab-btn" data-tab="notes" data-active="true">Notas</button>
            <button type="button" class="fn-tab-btn" data-tab="queue" data-active="false">Pendientes (0)</button>
            <button type="button" class="fn-tab-btn" data-tab="conflicts" data-active="false">Conflictos (0)</button>
          </nav>
        </div>
      </div>
    </main>

    <!-- Layer 2 Architecture Drawer -->
    <div class="fn-backdrop" id="fn-arch-backdrop" data-open="false" role="dialog" aria-modal="true">
      <div class="fn-drawer">
        <div class="fn-drawer-head">
          <h2 style="font-family:var(--font-serif);font-size:18px;margin:0;">Clean Arch + SQLite Outbox &amp; Lamport</h2>
          <button type="button" class="fn-btn-outline" id="fn-arch-close">Cerrar</button>
        </div>
        <div class="fn-drawer-body" id="fn-arch-body"></div>
      </div>
    </div>

    <script>
      (function () {
        const state = {
          isOnline: true,
          lamportTs: 1,
          activeTab: "notes",
          notes: [],
          queue: [],
          conflicts: [],
          audits: [],
          showComposer: false,
          bannerMsg: "",
        };

        const els = {
          body: document.getElementById("fn-phone-body"),
          connBtn: document.getElementById("fn-conn-btn"),
          offlineBanner: document.getElementById("fn-offline-banner"),
          archBackdrop: document.getElementById("fn-arch-backdrop"),
          archBody: document.getElementById("fn-arch-body"),
        };

        function el(tag, props, children) {
          const node = document.createElement(tag);
          if (props) {
            for (const [k, v] of Object.entries(props)) {
              if (k === "className") node.className = v;
              else if (k === "textContent") node.textContent = v;
              else if (k.startsWith("on") && typeof v === "function") node.addEventListener(k.slice(2).toLowerCase(), v);
              else node.setAttribute(k, String(v));
            }
          }
          if (Array.isArray(children)) {
            for (const c of children) {
              if (typeof c === "string") node.appendChild(document.createTextNode(c));
              else if (c) node.appendChild(c);
            }
          }
          return node;
        }

        async function refreshAll() {
          const [healthRes, notesRes, queueRes, confRes, audRes] = await Promise.all([
            fetch("/api/v1/health"),
            fetch("/api/v1/notes/local"),
            fetch("/api/v1/sync/queue"),
            fetch("/api/v1/conflicts"),
            fetch("/api/v1/sync/audit"),
          ]);
          const h = await healthRes.json();
          const n = await notesRes.json();
          const q = await queueRes.json();
          const c = await confRes.json();
          const a = await audRes.json();

          state.isOnline = Boolean(h.is_online);
          state.lamportTs = h.lamport_ts || 1;
          state.notes = n.notes || [];
          state.queue = q.mutations || [];
          state.conflicts = (c.conflicts || []).filter(function (x) { return !x.resolved; });
          state.audits = a.audits || [];

          els.connBtn.setAttribute("data-online", state.isOnline ? "true" : "false");
          els.connBtn.textContent = state.isOnline ? "Con Wi-Fi · En línea" : "Modo Avión · Sin señal";
          els.offlineBanner.setAttribute("data-visible", state.isOnline ? "false" : "true");

          const qTab = document.querySelector('[data-tab="queue"]');
          const cTab = document.querySelector('[data-tab="conflicts"]');
          const pendingCount = state.queue.filter(function (m) { return m.status === "QUEUED" || m.status === "PENDING"; }).length;
          if (qTab) qTab.textContent = "Pendientes (" + pendingCount + ")";
          if (cTab) cTab.textContent = "Conflictos (" + state.conflicts.length + ")";

          renderPhoneBody();
          renderArchitecture();
        }

        function renderComposer() {
          const titleIn = el("input", { className: "fn-input", placeholder: "Título de la nota..." });
          const bodyIn = el("textarea", { className: "fn-input", style: "min-height:74px;", placeholder: "Detalles o lista rápida..." });
          return el("div", { className: "fn-note-card", style: "border-color:var(--leather-accent);" }, [
            el("strong", { style: "display:block;margin-bottom:8px;font-size:13.5px;", textContent: "Nueva nota local (funciona con o sin señal)" }),
            el("div", { style: "display:flex;flex-direction:column;gap:8px;" }, [
              titleIn,
              bodyIn,
              el("div", { style: "display:flex;gap:8px;" }, [
                el("button", {
                  type: "button",
                  className: "fn-btn-primary",
                  textContent: "Guardar en teléfono",
                  onClick: async function () {
                    const r = await fetch("/api/v1/notes/local", {
                      method: "POST",
                      headers: { "Content-Type": "application/json" },
                      body: JSON.stringify({
                        site_code: "MOVIL-CAMPO",
                        title: titleIn.value.trim() || "Inspección rápida",
                        body: bodyIn.value.trim() || "Registro capturado desde la app móvil.",
                        severity: "INFO",
                        location: { latitude: 4.711, longitude: -74.0721 },
                      }),
                    });
                    if (r.ok) {
                      state.showComposer = false;
                      state.bannerMsg = state.isOnline ? "Nota guardada y en cola de sincronización." : "Nota guardada offline en SQLite.";
                      await refreshAll();
                    }
                  },
                }),
                el("button", { type: "button", className: "fn-mini-btn", textContent: "Cancelar", onClick: function () { state.showComposer = false; renderPhoneBody(); } }),
              ]),
            ]),
          ]);
        }

        function renderPhoneBody() {
          const children = [];
          if (state.bannerMsg) {
            children.push(el("div", { className: "fn-note-card", style: "background:#f5f5f4;font-size:12.5px;", textContent: state.bannerMsg }));
          }
          if (state.showComposer) {
            children.push(renderComposer());
          }

          if (state.activeTab === "notes") {
            for (const note of state.notes) {
              const pillCls =
                note.sync_state === "CONFLICT"
                  ? "fn-state-pill fn-pill-conf"
                  : note.sync_state === "PENDING_PUSH"
                    ? "fn-state-pill fn-pill-wait"
                    : "fn-state-pill fn-pill-sync";
              const pillTxt =
                note.sync_state === "CONFLICT"
                  ? "Conflicto"
                  : note.sync_state === "PENDING_PUSH"
                    ? "Por enviar"
                    : "Sincronizada";

              children.push(
                el("article", { className: "fn-note-card" }, [
                  el("div", { className: "fn-note-top" }, [
                    el("h3", { className: "fn-note-title", textContent: note.title }),
                    el("span", { className: pillCls, textContent: pillTxt }),
                  ]),
                  el("p", { className: "fn-note-body", textContent: note.body }),
                  el("div", { className: "fn-note-actions" }, [
                    el("button", {
                      type: "button",
                      className: "fn-mini-btn",
                      textContent: "Editar nota",
                      onClick: async function () {
                        await fetch("/api/v1/notes/local", {
                          method: "POST",
                          headers: { "Content-Type": "application/json" },
                          body: JSON.stringify({
                            note_id: note.note_id,
                            title: note.title,
                            body: note.body + " · Editado en móvil",
                          }),
                        });
                        state.bannerMsg = "Cambio guardado en la memoria local del teléfono.";
                        await refreshAll();
                      },
                    }),
                  ]),
                ]),
              );
            }
          } else if (state.activeTab === "queue") {
            const items = state.queue.slice(0, 12);
            if (items.length === 0) {
              children.push(el("div", { className: "fn-note-card", textContent: "No hay cambios pendientes en la cola local." }));
            } else {
              for (const m of items) {
                children.push(
                  el("div", { className: "fn-note-card" }, [
                    el("div", { style: "display:flex;justify-content:space-between;font-size:13px;font-weight:600;" }, [
                      el("span", { textContent: m.note_id }),
                      el("span", { textContent: m.status }),
                    ]),
                    el("div", { className: "fn-mono", style: "font-size:11.5px;color:var(--ink-stone);margin-top:4px;", textContent: m.operation + " · Lamport t=" + m.lamport_ts }),
                  ]),
                );
              }
            }
          } else {
            if (state.conflicts.length === 0) {
              children.push(el("div", { className: "fn-note-card", textContent: "Sin conflictos pendientes. Pulsa 'Simular choque' abajo para probar una edición simultánea." }));
            } else {
              for (const conf of state.conflicts) {
                children.push(
                  el("div", { className: "fn-note-card", style: "border-color:#ef4444;" }, [
                    el("h3", { className: "fn-note-title", textContent: "Conflicto en: " + conf.local_note.title }),
                    el("p", { className: "fn-note-body", textContent: "Tu teléfono: " + conf.local_note.body }),
                    el("p", { className: "fn-note-body", style: "color:var(--leather-accent);", textContent: "Otro dispositivo: " + conf.remote_note.body }),
                    el("div", { className: "fn-note-actions" }, [
                      el("button", { type: "button", className: "fn-btn-primary", textContent: "Conservar mía", onClick: function () { resolveConflict(conf.conflict_id, "KEEP_LOCAL"); } }),
                      el("button", { type: "button", className: "fn-mini-btn", textContent: "Usar nube", onClick: function () { resolveConflict(conf.conflict_id, "ACCEPT_REMOTE"); } }),
                      el("button", {
                        type: "button",
                        className: "fn-mini-btn",
                        textContent: "Combinar ambas",
                        onClick: function () {
                          resolveConflict(conf.conflict_id, "MANUAL_MERGE", conf.local_note.title, conf.local_note.body + " / " + conf.remote_note.body);
                        },
                      }),
                    ]),
                  ]),
                );
              }
            }
          }

          els.body.replaceChildren.apply(els.body, children);
        }

        async function resolveConflict(conflictId, strategy, mergedTitle, mergedBody) {
          if (!state.isOnline) {
            state.bannerMsg = "Conecta el Wi-Fi primero para resolver y sincronizar el conflicto.";
            renderPhoneBody();
            return;
          }
          const body = { strategy: strategy };
          if (mergedTitle) body.merged_title = mergedTitle;
          if (mergedBody) body.merged_body = mergedBody;
          const r = await fetch("/api/v1/conflicts/" + encodeURIComponent(conflictId) + "/resolve", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(body),
          });
          if (r.ok) {
            state.bannerMsg = "Conflicto resuelto (" + strategy + ") y sincronizado.";
            state.activeTab = "notes";
            document.querySelectorAll(".fn-tab-btn").forEach(function (b) {
              b.setAttribute("data-active", b.getAttribute("data-tab") === "notes" ? "true" : "false");
            });
            await refreshAll();
          }
        }

        els.connBtn.addEventListener("click", async function () {
          await fetch("/api/v1/device/connectivity", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ is_online: !state.isOnline }),
          });
          state.bannerMsg = "";
          await refreshAll();
        });

        document.getElementById("fn-add-btn").addEventListener("click", function () {
          state.activeTab = "notes";
          state.showComposer = true;
          renderPhoneBody();
        });

        document.getElementById("fn-sync-btn").addEventListener("click", async function () {
          const resp = await fetch("/api/v1/sync/run", { method: "POST" });
          const data = await resp.json();
          if (resp.status === 503) {
            state.bannerMsg = "Modo Avión activo: no se puede sincronizar hasta volver a estar en línea.";
            renderPhoneBody();
            return;
          }
          if (data.conflicts_detected > 0) {
            state.bannerMsg = "Se detectó 1 conflicto entre tu nota offline y la nube. Revisa la pestaña Conflictos.";
            state.activeTab = "conflicts";
            document.querySelectorAll(".fn-tab-btn").forEach(function (b) {
              b.setAttribute("data-active", b.getAttribute("data-tab") === "conflicts" ? "true" : "false");
            });
          } else {
            state.bannerMsg = "Sincronización completa: " + data.pushed_count + " enviadas, " + data.pulled_count + " recibidas.";
          }
          await refreshAll();
        });

        document.getElementById("fn-sim-remote-btn").addEventListener("click", async function () {
          if (state.notes.length === 0) return;
          const target = state.notes[0];
          // Turn offline -> make local edit -> force remote edit on server -> turn online -> sync triggers real conflict
          await fetch("/api/v1/device/connectivity", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ is_online: false }) });
          await fetch("/api/v1/notes/local", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ note_id: target.note_id, title: target.title, body: target.body + " [Cambio offline en campo]" }),
          });
          await fetch("/api/v1/notes/remote/" + encodeURIComponent(target.note_id) + "/simulate-edit", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ body: target.body + " [Editado desde oficina]", author_device_id: "oficina-web" }),
          });
          await fetch("/api/v1/device/connectivity", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ is_online: true }) });
          await fetch("/api/v1/sync/run", { method: "POST" });
          state.bannerMsg = "Choque simulado: elige cómo conservar o combinar las versiones.";
          state.activeTab = "conflicts";
          document.querySelectorAll(".fn-tab-btn").forEach(function (b) {
            b.setAttribute("data-active", b.getAttribute("data-tab") === "conflicts" ? "true" : "false");
          });
          await refreshAll();
        });

        document.querySelectorAll(".fn-tab-btn").forEach(function (btn) {
          btn.addEventListener("click", function () {
            state.activeTab = btn.getAttribute("data-tab") || "notes";
            document.querySelectorAll(".fn-tab-btn").forEach(function (b) {
              b.setAttribute("data-active", b === btn ? "true" : "false");
            });
            renderPhoneBody();
          });
        });

        function renderArchitecture() {
          const auditNodes = state.audits.slice(0, 6).map(function (a) {
            return el("div", { className: "fn-note-card" }, [
              el("div", { className: "fn-mono", style: "font-size:12px;font-weight:600;", textContent: a.direction + " · " + a.status }),
              el("div", { className: "fn-mono", style: "font-size:11.5px;color:var(--ink-stone);", textContent: "Push: " + a.pushed_count + " · Pull: " + a.pulled_count + " · Conflictos: " + a.conflicts_detected }),
            ]);
          });
          els.archBody.replaceChildren.apply(
            els.archBody,
            [
              el("div", { className: "fn-note-card", style: "background:var(--screen-cream);" }, [
                el("strong", { style: "display:block;margin-bottom:4px;", textContent: "Clean Architecture + SQLite Local Outbox + Relojes Lamport" }),
                el("span", { style: "font-size:13px;color:var(--ink-stone);", textContent: "Reloj lógico actual: Lamport t=" + state.lamportTs + ". Blueprint móvil completo en React Native (Expo 52 + TypeScript Strict 0 any) incluido en mobile-app/." }),
              ]),
            ].concat(auditNodes),
          );
        }

        document.getElementById("fn-arch-btn").addEventListener("click", function () { renderArchitecture(); els.archBackdrop.setAttribute("data-open", "true"); });
        document.getElementById("fn-arch-close").addEventListener("click", function () { els.archBackdrop.setAttribute("data-open", "false"); });
        window.addEventListener("keydown", function (e) { if (e.key === "Escape") els.archBackdrop.setAttribute("data-open", "false"); });

        refreshAll();
      })();
    </script>
  </body>
</html>
